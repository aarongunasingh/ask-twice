[project]
name = "asktwice"
version = "0.1.0"
description = "Jev vs NLI question-answering as features for CFPB monetary-relief prediction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasketch>=1.6",
    "duckdb>=1.1",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pyarrow>=17",
    "pyyaml>=6",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7"]
nli = ["torch", "transformers", "sentencepiece"]  # DeBERTa-v3 tokenizer needs sentencepiece

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asktwice"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
